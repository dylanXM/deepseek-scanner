name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest -q
      - name: Dogfood - clean fixture must pass the CI gate
        run: deepseek-scan scan tests/fixtures/negative --fail-on high
      - name: Dogfood - positive fixture must produce findings
        run: |
          deepseek-scan scan tests/fixtures/positive --format json --out /tmp/r.json
          python -c "import json; d=json.load(open('/tmp/r.json')); assert d['summary']['total_findings'] >= 10, d['summary']"
